<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表达力 · 逻辑表达训练</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=7">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#059669',
                        'primary-light': '#10B981',
                        accent: '#059669',
                        'accent-light': '#10B981',
                        surface: '#F0FDF4'
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="app" class="flex flex-col h-screen">
        <main id="main" class="flex-1 overflow-y-auto p-4">
            <!-- Views will be injected here -->
        </main>

        <nav id="footer-nav" class="bg-surface border-t border-primary/10 px-6 py-3 hidden shrink-0">
            <div class="flex justify-between items-center text-sm">
                <div class="text-black/60">
                    第 <span id="footer-day" class="font-bold text-primary">1</span> 篇
                </div>
                <button onclick="app.goHome()" class="text-black/60 hover:text-primary transition-colors">返回主页</button>
            </div>
        </nav>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}?v=8"></script>
</body>
</html>
